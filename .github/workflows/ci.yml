name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  php-quality:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:9.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: webte2_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=3s
          --health-retries=5
    env:
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: webte2_test
      DB_USERNAME: root
      DB_PASSWORD: root
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: 6379
      REDIS_CLIENT: predis
      CACHE_STORE: redis
      SESSION_DRIVER: redis
      QUEUE_CONNECTION: redis
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP 8.5
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: pdo_mysql, mbstring, intl, bcmath, gd, zip, exif, pcntl
          coverage: none
          tools: composer:v2

      - name: Cache composer dependencies
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      - run: composer install --prefer-dist --no-interaction --no-progress

      - run: cp .env.ci.example .env

      - run: php artisan key:generate

      - run: vendor/bin/pint --test

      - run: vendor/bin/phpstan analyse --no-progress --memory-limit=512M

      - run: vendor/bin/pest --parallel --exclude-group=integration

      - name: Build and start octave-bridge
        run: |
          docker compose -f docker-compose.yml -f docker-compose.ci.yml up -d --build octave-bridge
          for i in $(seq 1 30); do
            status=$(docker inspect -f '{{.State.Health.Status}}' webte2-octave-bridge-1 2>/dev/null || true)
            if [ "$status" = "healthy" ]; then
              echo "bridge healthy after $((i * 2))s"
              break
            fi
            sleep 2
          done
          docker inspect -f '{{.State.Health.Status}}' webte2-octave-bridge-1 | grep -q '^healthy$'

      - name: Run octave integration tests against live bridge
        env:
          OCTAVE_BRIDGE_URL: http://localhost:8001
        run: vendor/bin/pest --group integration

      - name: Tear down octave-bridge
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.ci.yml down -v

  js-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci

      - run: npm run qa

  python-quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docker/octave-bridge
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - run: uv sync

      - run: make qa

      - name: Prepare .env for docker compose
        working-directory: .
        # docker-compose.yml declares `env_file: .env` on web/cli; compose parsing
        # demands the file exist even if those services are never started.
        run: cp .env.ci.example .env

      - name: Start octave-bridge
        working-directory: .
        run: |
          docker compose up -d octave-bridge
          # Wait for healthcheck — poll up to 60 s (30 × 2 s)
          for i in $(seq 1 30); do
            status=$(docker inspect -f '{{.State.Health.Status}}' webte2-octave-bridge-1 2>/dev/null || true)
            if [ "$status" = "healthy" ]; then
              echo "bridge healthy after $((i * 2))s"
              break
            fi
            sleep 2
          done
          docker inspect -f '{{.State.Health.Status}}' webte2-octave-bridge-1 | grep -q '^healthy$'

      - name: Assert no network egress from bridge
        working-directory: .
        run: |
          # octave_isolated network has internal: true — bridge must NOT reach the internet.
          # Use curl (wget is not in the image); --connect-timeout 3 ensures a fast failure.
          if docker compose exec -T octave-bridge curl -fsS --connect-timeout 3 http://example.com; then
            echo "FAIL: bridge reached the open internet — no-egress is broken"
            exit 1
          fi
          echo "OK: bridge cannot reach the open internet"

      - name: Assert /health is reachable locally
        working-directory: .
        run: docker compose exec -T octave-bridge curl -fsS http://localhost:8001/health

      - name: Tear down
        if: always()
        working-directory: .
        run: docker compose down -v
