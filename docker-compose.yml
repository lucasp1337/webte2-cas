name: webte2

services:
  nginx:
    image: nginx:1.27-alpine
    # Host port 8080 (not 80) to avoid colliding with apache2 / IIS on the host.
    # nginx still listens on 80 inside the docker network for cli/web reachability.
    ports: ["8080:80"]
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./public:/var/www/html/public:ro
    depends_on:
      web:
        condition: service_started
    networks: [webte2]
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      target: web
    volumes:
      - .:/var/www/html
    environment:
      CONTAINER_ROLE: web
    env_file: .env
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      octave-bridge:
        condition: service_started
    networks: [webte2, octave_isolated]
    restart: unless-stopped

  cli:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      target: cli
    volumes:
      - .:/var/www/html
    # Hardening: cli runs Horizon + Chromium-via-Browsershot. read_only:true
    # would break Laravel's storage/, bootstrap/cache/, and similar bind-mount
    # writes — instead we keep the rootfs writable via the bind mount but lock
    # everything else down. Note: Chromium runs with --no-sandbox here (root
    # PHP-FPM); these container-level controls are the load-bearing isolation.
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=256m,mode=1777
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.5'
    environment:
      CONTAINER_ROLE: cli
    env_file: .env
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      octave-bridge:
        condition: service_started
    networks: [webte2, octave_isolated]
    restart: unless-stopped

  mysql:
    image: mysql:9.0
    environment:
      MYSQL_DATABASE: webte2
      MYSQL_USER: webte2
      MYSQL_PASSWORD: changeme
      MYSQL_ROOT_PASSWORD: changeme
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-pchangeme"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [webte2]

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks: [webte2]

  octave-bridge:
    build: ./docker/octave-bridge
    environment:
      OCTAVE_BIN: /usr/bin/octave
      SESSION_DIR: /var/octave/sessions
      SLOWDOWN_MS: 500
      # UV_CACHE_DIR stays at /tmp/uv-cache; uv creates the dir on first use.
      # tmpfs mounts /tmp at runtime so the dir does not need to pre-exist.
    volumes:
      - octave_sessions:/var/octave/sessions
    networks:
      - octave_isolated    # only this network — no internet egress (internal: true)
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    ulimits:
      cpu: 30
      nproc: 64
      fsize: 10485760      # 10 MB cap on per-write file size
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '1.0'
    restart: unless-stopped

volumes:
  mysql_data:
  redis_data:
  octave_sessions:

networks:
  webte2:
    driver: bridge
  octave_isolated:
    driver: bridge
    internal: true    # blocks internet egress; web/cli join both networks to reach bridge
