name: webte2

services:
  nginx:
    image: nginx:1.27-alpine
    ports: ["80:80"]
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./public:/var/www/html/public:ro
    depends_on:
      web:
        condition: service_started
    networks: [webte2]
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      target: web
    volumes:
      - .:/var/www/html
    environment:
      CONTAINER_ROLE: web
    env_file: .env
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      octave-bridge:
        condition: service_started
    networks: [webte2]
    restart: unless-stopped

  cli:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      target: cli
    volumes:
      - .:/var/www/html
    environment:
      CONTAINER_ROLE: cli
    env_file: .env
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      octave-bridge:
        condition: service_started
    networks: [webte2]
    restart: unless-stopped

  mysql:
    image: mysql:9.0
    environment:
      MYSQL_DATABASE: webte2
      MYSQL_USER: webte2
      MYSQL_PASSWORD: changeme
      MYSQL_ROOT_PASSWORD: changeme
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-pchangeme"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [webte2]

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks: [webte2]

  octave-bridge:
    build: ./docker/octave-bridge
    environment:
      OCTAVE_BIN: /usr/bin/octave
      SESSION_DIR: /var/octave/sessions
      SLOWDOWN_MS: 500
    volumes:
      - octave_sessions:/var/octave/sessions
    networks: [webte2]
    # Phase 02 hardens this further: drop capabilities, set ulimits, no internet egress.

volumes:
  mysql_data:
  redis_data:
  octave_sessions:

networks:
  webte2:
    driver: bridge
