# Host nginx config for node30.webte.fei.stuba.sk
#
# This file lives on the school server at:
#   /etc/nginx/sites-available/node30.webte.fei.stuba.sk
# and is symlinked into /etc/nginx/sites-enabled/.
#
# The application stack runs inside docker compose; its nginx container
# publishes :8080 on the host (see docker-compose.yml). This host-level
# nginx terminates TLS (via certbot) and reverse-proxies to that port.
#
# After this file is in place run:
#   sudo certbot --nginx -d node30.webte.fei.stuba.sk
# Certbot will rewrite the listen 80 block to redirect to https and append
# a listen 443 ssl block with the certificate paths.

server {
    listen 80;
    listen [::]:80;
    server_name node30.webte.fei.stuba.sk;

    # Allow Let's Encrypt HTTP-01 challenges through unproxied.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # certbot --nginx will add an SSL redirect for everything else here.
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;

        # Pass the original host + scheme so Laravel generates correct URLs
        # and SESSION_SECURE_COOKIE=true keeps the cookie behind TLS.
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        # Inertia / SPA: keep websocket-style upgrades working in case Horizon
        # dashboard or future broadcasting wants them.
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";

        # Browsershot PDF jobs and large CSV exports can take a while.
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;

        # Match the inner nginx client_max_body_size so uploads do not get
        # truncated at the outer layer.
        client_max_body_size 16M;
    }
}
