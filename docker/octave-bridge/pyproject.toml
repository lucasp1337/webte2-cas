[project]
name = "octave-bridge"
version = "0.1.0"
description = "Sandboxed HTTP wrapper around GNU Octave for the WEBTE2 CAS app."
requires-python = ">=3.13"
dependencies = [
    "aiohttp>=3.10",
]

[dependency-groups]
dev = [
    "ruff>=0.6",
    "mypy>=1.11",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM", "RUF"]
# N818 (Error suffix on exceptions): domain-aligned exception names mirror the
# PHP-side `OctaveCommandRejectedException` etc. and the phase doc's vocabulary.
ignore = ["N818"]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["src", "tests"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
